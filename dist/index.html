<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f5eb">
  <meta name="description" content="Read stories, learn Chinese characters, and collect stickers with a town full of cats.">
  <title>猫猫学中文 · Cats Learn Chinese</title>
  <link rel="icon" href="/assets/cats.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/adventure.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
  <symbol id="i-paw" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 10.5c-2.7 0-7.5 4.2-7.5 7.1 0 2 1.7 2.9 3.6 2.9 1.5 0 2.5-.8 3.9-.8s2.4.8 3.9.8c1.9 0 3.6-.9 3.6-2.9 0-2.9-4.8-7.1-7.5-7.1Z"/><ellipse fill="currentColor" stroke="none" cx="4.2" cy="10.2" rx="2.2" ry="3" transform="rotate(-28 4.2 10.2)"/><ellipse fill="currentColor" stroke="none" cx="9.2" cy="6" rx="2.1" ry="3.1" transform="rotate(-12 9.2 6)"/><ellipse fill="currentColor" stroke="none" cx="14.8" cy="6" rx="2.1" ry="3.1" transform="rotate(12 14.8 6)"/><ellipse fill="currentColor" stroke="none" cx="19.8" cy="10.2" rx="2.2" ry="3" transform="rotate(28 19.8 10.2)"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M8 3v18m6-14 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8L14 7Z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zm4 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zm5 4 5 6m0-6-5 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10m-9 10v-6h4v6"/></symbol>
  <symbol id="i-hint" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
</svg>
<section id="cover" class="cover" aria-labelledby="cover-title" hidden>
  <div class="cover-page">
    <h1 id="cover-title" data-zh="猫猫学中文">Cats Learn Chinese</h1>
    <p class="cover-subtitle" data-zh="跟猫猫读故事、认汉字">Read stories and learn Chinese characters with the cats.</p>
    <div class="cover-cats" aria-hidden="true">
      <span class="sprite sprite-cat"></span><span class="sprite sprite-car"></span>
    </div>
    <button class="primary" id="open-book"><span data-zh="打开绘本">Open the book</span> <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    <div class="cover-language">
      <label for="cover-language" data-zh="界面语言">Language</label>
      <select id="cover-language" class="language-select">
        <option value="en" lang="en">English</option>
        <option value="zh-Hans" lang="zh-Hans">简体中文</option>
      </select>
    </div>
  </div>
</section>
<div id="town" hidden>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><svg class="brand-cat" viewBox="0 0 120 120" aria-hidden="true"><use href="/assets/cats.svg#tangerine"/></svg><span lang="zh-Hans">猫猫学中文<small lang="en">CATS LEARN CHINESE</small></span></div>
    <div class="top-actions">
      <select id="map-language" class="language-select" aria-label="Interface language" data-zh-label="界面语言">
        <option value="en" lang="en">English</option>
        <option value="zh-Hans" lang="zh-Hans">简体中文</option>
      </select>
      <button id="cover-back" class="icon-button" aria-label="Back to the cover" data-zh-label="返回绘本封面"><svg class="icon"><use href="#i-home"/></svg></button>
      <button id="sound" class="icon-button" aria-label="Sound" data-zh-label="发音" aria-pressed="true"><svg class="icon"><use href="#i-sound"/></svg></button>
      <button id="album" class="album-button" aria-label="Sticker book" data-zh-label="贴纸册"><svg class="icon"><use href="#i-book"/></svg><span data-zh="贴纸册">Stickers</span><b id="album-count"></b></button>
    </div>
  </div>
</header>
<main>
  <section class="intro" aria-labelledby="welcome">
    <div>
      <h1 id="welcome"><span data-zh="小猫出发，">Explore with</span> <em data-zh="去认字！">the cats!</em></h1>
      <p class="subtitle" data-zh="逛小镇、听汉字、做任务，收集可爱的猫咪贴纸。">Visit each stop, learn Chinese, and collect cat stickers.</p>
    </div>
    <div class="progress-card">
      <div class="progress-heading"><svg class="icon"><use href="#i-paw"/></svg><b data-zh="我的探索进度">My progress</b><span id="progress-count"></span></div>
      <div id="course-progress" class="progress-track" role="progressbar" aria-label="Lesson progress" data-zh-label="探索进度" aria-valuemin="0" aria-valuenow="0"><div id="progress-fill"></div></div>
      <p id="character-progress" class="character-progress"></p>
    </div>
  </section>
  <div id="course-sections" class="route-tabs course-sections" role="group" aria-label="Course sections" data-zh-label="课程分册"></div>
  <div id="routes" class="route-tabs" role="group" aria-label="Book routes" data-zh-label="绘本路线"></div>
  <section class="map-section" id="map-section">
    <div class="map">
      <img class="landscape" id="map-art" src="/assets/oil-town.jpg" width="1140" height="460" alt="">
      <div class="map-key"><span></span> <b id="map-name"></b></div>
      <div id="stops" class="stops"></div>
    </div>
    <div class="map-footer">
      <p><svg class="icon"><use href="#i-hint"/></svg><span id="map-tip"></span></p>
      <button class="text-button" id="guide" data-zh="家长角（按住）">Grown-ups (hold)</button>
    </div>
  </section>
</main>
</div>
<dialog id="journey" aria-labelledby="scene-title"><div id="scene"></div></dialog>
<dialog id="panel" aria-labelledby="panel-title"><div id="panel-body"></div></dialog>
<audio id="narration" preload="auto" hidden></audio>
<div id="notice" class="notice" role="status"></div>
</body>
</html>
