<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f5eb">
  <meta name="description" content="跟着小猫逛小镇：听读、认字，收集属于你的猫咪贴纸。">
  <title>喵喵识字镇 · Meow Word Town</title>
  <link rel="icon" href="/assets/cats.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
  <symbol id="i-paw" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 10.5c-2.7 0-7.5 4.2-7.5 7.1 0 2 1.7 2.9 3.6 2.9 1.5 0 2.5-.8 3.9-.8s2.4.8 3.9.8c1.9 0 3.6-.9 3.6-2.9 0-2.9-4.8-7.1-7.5-7.1Z"/><ellipse fill="currentColor" stroke="none" cx="4.2" cy="10.2" rx="2.2" ry="3" transform="rotate(-28 4.2 10.2)"/><ellipse fill="currentColor" stroke="none" cx="9.2" cy="6" rx="2.1" ry="3.1" transform="rotate(-12 9.2 6)"/><ellipse fill="currentColor" stroke="none" cx="14.8" cy="6" rx="2.1" ry="3.1" transform="rotate(12 14.8 6)"/><ellipse fill="currentColor" stroke="none" cx="19.8" cy="10.2" rx="2.2" ry="3" transform="rotate(28 19.8 10.2)"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M8 3v18m6-14 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8L14 7Z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zm4 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
  <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zm5 4 5 6m0-6-5 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-hint" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
</svg>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><svg class="brand-cat" viewBox="0 0 120 120" aria-hidden="true"><use href="/assets/cats.svg#tangerine"/></svg><span>喵喵识字镇<small>MEOW WORD TOWN</small></span></div>
    <div class="top-actions">
      <button id="sound" class="icon-button" aria-label="发音" aria-pressed="true"><svg class="icon"><use href="#i-sound"/></svg></button>
      <button id="album" class="album-button"><svg class="icon"><use href="#i-book"/></svg><span>贴纸册</span><b id="album-count">0 / 6</b></button>
    </div>
  </div>
</header>
<main>
  <section class="intro" aria-labelledby="welcome">
    <div>
      <p class="eyebrow"><svg class="icon"><use href="#i-paw"/></svg> 猫猫的识字大冒险</p>
      <h1 id="welcome">小猫出发，<em>去认字！</em></h1>
      <p class="subtitle">逛小镇、听汉字、做任务，收集可爱的猫咪贴纸。</p>
    </div>
    <div class="progress-card">
      <div class="progress-heading"><svg class="icon"><use href="#i-paw"/></svg><b>我的探索进度</b><span id="progress-count">0 / 6 关</span></div>
      <div id="course-progress" class="progress-track" role="progressbar" aria-label="探索进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div id="progress-fill"></div></div>
    </div>
  </section>
  <section class="map-section" aria-label="小镇地图">
    <div class="map">
      <img class="landscape" src="/assets/town.svg" alt="">
      <div class="map-key"><span></span> 小镇地图 <small>TOWN MAP</small></div>
      <div id="stops" class="stops"></div>
    </div>
    <div class="map-footer">
      <p><svg class="icon"><use href="#i-hint"/></svg><span id="map-tip">点亮的站点可以开始，完成一关就会打开下一站。</span></p>
      <button class="text-button" id="guide">家长小提示 <span aria-hidden="true">↗</span></button>
    </div>
  </section>
  <footer>每天学一点，猫猫陪你读。<svg class="icon"><use href="#i-paw"/></svg></footer>
</main>
<dialog id="panel" aria-labelledby="panel-title"><div id="panel-body"></div></dialog>
<div id="notice" class="notice" role="status"></div>
</body>
</html>
