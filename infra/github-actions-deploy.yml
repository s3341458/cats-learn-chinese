AWSTemplateFormatVersion: '2010-09-09'
Description: Let GitHub Actions publish Cats Learn Chinese on main.

Parameters:
  ContentBucket:
    Type: String
    Description: The existing site content bucket.
  DistributionId:
    Type: String
    Description: The existing CloudFront distribution ID.

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cats-learn-chinese-github-main
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:s3341458/cats-learn-chinese:ref:refs/heads/main
      Policies:
        - PolicyName: PublishSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentBucket}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:${AWS::Partition}:s3:::${ContentBucket}/*
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}

Outputs:
  RoleArn:
    Value: !GetAtt DeploymentRole.Arn
